name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Authentication uses npm
# trusted publishing (GitHub OIDC), so no npm token is stored in this repository.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - run: npm install --global npm@^11.5.1
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      # Tagging a version that was already published (for example the first release,
      # which had to be published manually) skips the upload instead of failing.
      - name: Check whether this version is already on npm
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already published; skipping npm publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
